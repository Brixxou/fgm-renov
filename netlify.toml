[build]
  command = "npm run build"
  publish = "_site"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ── Ancienne adresse de la page Douche senior (MaPrimeAdapt retiré du site) ──
[[redirects]]
  from = "/douche-senior-maprimeadapt/"
  to = "/douche-senior/"
  status = 301
  force = true

[[redirects]]
  from = "/douche-senior-maprimeadapt"
  to = "/douche-senior/"
  status = 301
  force = true

# ── Redirection vers le domaine officiel ──
# L'adresse technique Netlify renvoie vers le domaine principal : une seule URL indexée.
# (fgmrenov.fr → www.fgmrenov.fr est géré par Netlify via le « primary domain ».)
[[redirects]]
  from = "https://fgmrenov.netlify.app/*"
  to = "https://www.fgmrenov.fr/:splat"
  status = 301
  force = true

